name: CI Practice

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run test
        run: |
          echo "Running CI test..."
          grep "CI test is working" test.txt
          echo "Test passed!"
